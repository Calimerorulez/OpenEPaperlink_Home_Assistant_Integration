name: HACS Action

on:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Forks are not submissions to the HACS default catalog. Validate
          # integration packaging, but keep catalog metadata checks upstream.
          ignore: ${{ github.event.repository.fork && 'issues topics' || '' }}
